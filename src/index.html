<!doctype html>

<html lang="en-IN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Product Management</title>

        <link
            rel="shortcut icon"
            href="assets/icons/product_management.svg"
            type="image/x-icon"
        />

        <meta
            name="description"
            content="This is the Product Management site, which lets you Create, Read, Update, Delete products."
        />

        <!-- Open Graph meta tags -->
        <meta property="og:title" content="Product Management" />
        <meta
            property="og:description"
            content="This is the Product Management site, which lets you Create, Read, Update, Delete products."
        />
        <meta property="og:image" content="assets/images/cover_image.jpeg" />
        <meta property="og:image:alt" content="Product Management" />

        <!-- Twitter Card meta tags -->
        <meta name="twitter:title" content="Product Management" />
        <meta
            name="twitter:description"
            content="This is the Product Management site, which lets you Create, Read, Update, Delete products."
        />
        <meta name="twitter:url" content="/" />
        <meta
            name="twitter:image:src"
            content="assets/images/cover_image.jpeg"
        />
        <meta name="twitter:image:alt" content="Product Management" />

        <link rel="stylesheet" href="styles/index.css" />
        <link rel="stylesheet" href="styles/table.css" />
        <link rel="stylesheet" href="styles/control-buttons.css" />
        <link rel="stylesheet" href="styles/user-form.css" />

        <script src="scripts/index.ts" type="module"></script>
    </head>
    <body>
        <h1>User Management System</h1>

        <div class="control-btns">
            <!-- Sort Button and options -->
            <div class="sort-container">
                <span role="heading">Sort By</span>
                <select
                    name="sort-field"
                    id="sort-field"
                    aria-label="Sort Field"
                >
                    <option value="firstName">First Name</option>
                    <option value="lastName">Last Name</option>
                    <option value="age">Age</option>
                </select>
                <select
                    name="sort-order"
                    id="sort-order"
                    aria-label="Sort Order"
                >
                    <option value="asc">Ascending</option>
                    <option value="desc">Descending</option>
                </select>

                <button id="sort-btn" class="sort-btn">Sort</button>
            </div>

            <!-- Show the popup to Add User. -->
            <button
                id="add-user-btn"
                class="add-user-btn"
                popovertarget="user-form-popup"
                popovertargetaction="show"
            >
                Add User
            </button>
        </div>

        <!-- Add/Update User Form Popup -->
        <div id="user-form-popup" popover="auto">
            <div class="user-form-container">
                <h2 id="user-form-heading">Add User</h2>
                <form id="user-form" class="user-form">
                    <div class="form-item">
                        <label for="first-name">First Name</label>
                        <input
                            id="first-name"
                            name="first-name"
                            type="text"
                            placeholder="Enter First Name"
                            maxlength="40"
                            required
                        />
                    </div>
                    <div class="form-item">
                        <label for="last-name">Last Name</label>
                        <input
                            id="last-name"
                            name="last-name"
                            type="text"
                            placeholder="Enter Last Name"
                            maxlength="40"
                            required
                        />
                    </div>
                    <div class="form-item">
                        <label for="age">Age</label>
                        <input
                            id="age"
                            name="age"
                            type="number"
                            placeholder="Enter Age"
                            required
                        />
                    </div>
                    <div class="form-item">
                        <label for="email">Email</label>
                        <input
                            id="email"
                            name="email"
                            type="email"
                            maxlength="254"
                            placeholder="Enter Email Address"
                            required
                        />
                    </div>
                    <div class="form-item">
                        <label for="phone">Phone</label>
                        <input
                            id="phone"
                            name="phone"
                            type="tel"
                            placeholder="Enter Phone Number"
                            maxlength="20"
                            required
                        />
                    </div>
                    <div class="form-item gender">
                        <input
                            id="male"
                            name="gender"
                            value="male"
                            type="radio"
                            required
                        />
                        <label for="male">Male</label>
                        <input
                            id="female"
                            name="gender"
                            value="female"
                            type="radio"
                            required
                        />
                        <label for="female">Female</label>
                    </div>

                    <button class="submit-btn">Submit</button>
                </form>
            </div>
        </div>

        <!-- Users Table -->
        <div class="table-container">
            <table class="users">
                <thead>
                    <tr>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Age</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Gender</th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                </thead>

                <tbody id="users-list"></tbody>
            </table>
        </div>
    </body>
</html>
